<div class="modal">

    @let character = popupService.character$ | async;

    @if(character) {
    <div class="card" [id]="character.id" [class.dark]="!themeService.lightOn$.getValue()">
        <app-modal-actions></app-modal-actions>
        <img [src]="character.image" alt="character">

        <div class="card-info">
            <p class="card-name">{{character.name}}</p>

            <app-character-form [currCharacter]="character"></app-character-form>
        </div>
    </div>
    }
</div>
